name: Build multi-platform releases

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build AppImage (Linux)
        run: bash packaging/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build installer (Windows)
        shell: pwsh
        run: ./packaging/build-windows.ps1
        env:
          # Firma de código opcional (Trusted Signing): si estos secrets no
          # están definidos en el repo, build-windows.ps1 genera el .exe sin
          # firmar igual que antes. Ver packaging/README.md.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/*.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build installer (macOS)
        run: bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/dist/*.zip
          if-no-files-found: error

  publish:
    # Publica una GitHub Release con los tres binarios cuando el workflow
    # se dispara por un tag v* (p. ej. v1.7). En un workflow_dispatch sin tag
    # no se ejecuta.
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos de las tres plataformas
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Crear la release y adjuntar los binarios
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**/*.zip
          fail_on_unmatched_files: true
